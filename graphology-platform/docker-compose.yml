services:
  postgres:
    image: postgres:16-alpine
    container_name: graphology-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: graphology
      POSTGRES_PASSWORD: graphology
      POSTGRES_DB: graphology
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U graphology -d graphology']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: graphology-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://graphology:graphology@postgres:5432/graphology?schema=public
      DIRECT_URL: postgresql://graphology:graphology@postgres:5432/graphology?schema=public
      JWT_SECRET: development-secret-change-in-production
      JWT_REFRESH_SECRET: development-refresh-secret-change-in-production
      RESEND_API_KEY: re_placeholder
      RAZORPAY_KEY_ID: rzp_placeholder
      RAZORPAY_SECRET: rzp_secret_placeholder
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: graphology-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
