name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.9'

jobs:
  quality:
    name: Lint, Typecheck, Build, Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @graphology/database db:generate
        env:
          DATABASE_URL: postgresql://graphology:graphology@localhost:5432/graphology?schema=public
          DIRECT_URL: postgresql://graphology:graphology@localhost:5432/graphology?schema=public

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @graphology/tests exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://graphology:graphology@localhost:5432/graphology?schema=public
          DIRECT_URL: postgresql://graphology:graphology@localhost:5432/graphology?schema=public
          CI: true
